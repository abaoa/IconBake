[package]
name = "iconbake"
version = "0.1.0"
description = "Bake images into an icon font"
authors = ["abaoa"]
edition = "2021"

[build-dependencies]
# NOTE: tauri-build 1.x tops out at 1.5.6 (no 1.6.x was ever published);
# the "1.5" caret resolves the latest 1.x stable.
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `custom-protocol` is required for release builds so the app serves the
# embedded `dist/` assets over the `tauri://localhost` custom protocol instead
# of trying to reach the dev server. Keep it in default so `cargo build --release`
# produces a self-contained exe without extra flags.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
